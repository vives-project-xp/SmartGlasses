name: Build and Publish Server Docker Image

on:
  push:
    branches:
      - "main"
    paths:
      - "server/**"
  pull_request:
    branches:
      - "main"
    paths:
      - "server/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/server

defaults:
  run:
    working-directory: server/

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -oP '(?<=version = ")[^"]*' ./pyproject.toml | head -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.0.0

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Check if Docker image with full version tag already exists
      - name: Check if image version exists
        id: check-image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="$REGISTRY/${IMAGE_NAME,,}:${{ steps.version.outputs.version }}"
          echo "Checking if image exists: $IMAGE"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image $IMAGE already exists, skipping build and push"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Image $IMAGE does not exist, proceeding with build"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        if: github.event_name == 'pull_request' || steps.check-image.outputs.exists != 'true'
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        if: github.event_name == 'pull_request' || steps.check-image.outputs.exists != 'true'
        uses: docker/build-push-action@v5.0.0
        with:
          # The `defaults: run: working-directory` does not apply to actions.
          # Set the build context and Dockerfile path relative to the repository root
          context: ./server
          file: ./server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: github.event_name != 'pull_request' && steps.check-image.outputs.exists != 'true'
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      # Create and push a git tag for the server release (only on non-PR runs and new versions)
      - name: Create and push git tag
        if: github.event_name != 'pull_request' && steps.check-image.outputs.exists != 'true'
        run: |
          set -euo pipefail
          TAG_REF=server-v${{ steps.version.outputs.version }}

          # Check if the tag already exists remotely
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_REF$"; then
            echo "Tag $TAG_REF already exists, skipping tag creation"
            exit 0
          fi

          echo "Creating tag $TAG_REF"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Annotated tag with message
          git tag -a "$TAG_REF" -m "Server release $TAG_REF"
          # Push the tag using the repository's origin
          git push origin "$TAG_REF"
