name: Build and Publish Client Docker Image

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
  pull_request:
    branches:
      - "main"
    paths:
      - "docs/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/docs

defaults:
  run:
    working-directory: docs/
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version
        id: version
        run: |
          # Goal: produce a numeric counter 'N' so image tag becomes 'docs-vN'.
          # 1) If files contain an explicit docs tag like 'docs-vN', use that (first match).
          # 2) Otherwise, look for the latest git tag matching 'docs-vN' and bump N by 1.
          # 3) If none found, start at 1.

          set -euo pipefail
          NUM=""

          # Try to find a docs-vN occurrence in files
          NUM=$(grep -oE 'docs-v[0-9]+' -R --exclude-dir=.git . 2>/dev/null | sed -E 's/.*docs-v([0-9]+).*/\1/' | head -n1 || true)

          if [ -z "$NUM" ]; then
            git fetch --tags --quiet
            LATEST_DOCS_TAG=$(git tag --list --sort=-v:refname 'docs-v*' | grep -E '^docs-v[0-9]+' | head -n1 || true)
            if [ -n "$LATEST_DOCS_TAG" ]; then
              NUM=${LATEST_DOCS_TAG#docs-v}
              NUM=$((NUM + 1))
            else
              # No docs-v tags found: start at 1
              NUM=1
            fi
          fi

          echo "version=$NUM" >> $GITHUB_OUTPUT
          echo "Detected docs version number: $NUM"

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.0.0

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=docs-v${{ steps.version.outputs.version }}
            type=raw,value=latest

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5.0.0
        with:
          # The `defaults: run: working-directory` does not apply to actions.
          # Set the build context and Dockerfile path relative to the repository root
          context: .
          file: ./config/mkdocs/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Create and push a git tag for the docs release (only on non-PR runs)
      - name: Create and push git tag
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          TAG_REF=docs-v${{ steps.version.outputs.version }}
          echo "Creating tag $TAG_REF"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Annotated tag with message
          git tag -a "$TAG_REF" -m "Docs release $TAG_REF"
          # Push the tag using the repository's origin (actions/checkout set this up)
          git push origin "$TAG_REF"

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
