apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signapse-ingress
  namespace: signapse
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: signapse.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 3000
    - host: api.signapse.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 8000
    - host: docs.signapse.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs
                port:
                  number: 8000
    - host: signapse.devbitapp.be
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 3000
    - host: api.signapse.devbitapp.be
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 8000
    - host: docs.signapse.devbitapp.be
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs
                port:
                  number: 8000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-smart-gestures
  namespace: signapse
spec:
  redirectRegex:
    regex: ^https?://smart-gestures\.devbitapp\.be(/.*)?$
    replacement: https://signapse.devbitapp.be${1}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-api-smart-gestures
  namespace: signapse
spec:
  redirectRegex:
    regex: ^https?://api\.smart-gestures\.devbitapp\.be(/.*)?$
    replacement: https://api.signapse.devbitapp.be${1}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-docs-smart-gestures
  namespace: signapse
spec:
  redirectRegex:
    regex: ^https?://docs\.smart-gestures\.devbitapp\.be(/.*)?$
    replacement: https://docs.signapse.devbitapp.be${1}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redirect-smart-gestures
  namespace: signapse
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`smart-gestures.devbitapp.be`)
      kind: Rule
      middlewares:
        - name: redirect-smart-gestures
          namespace: signapse
      services:
        - name: client
          port: 3000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redirect-api-smart-gestures
  namespace: signapse
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`api.smart-gestures.devbitapp.be`)
      kind: Rule
      middlewares:
        - name: redirect-api-smart-gestures
          namespace: signapse
      services:
        - name: server
          port: 8000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redirect-docs-smart-gestures
  namespace: signapse
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`docs.smart-gestures.devbitapp.be`)
      kind: Rule
      middlewares:
        - name: redirect-docs-smart-gestures
          namespace: signapse
      services:
        - name: docs
          port: 8000
